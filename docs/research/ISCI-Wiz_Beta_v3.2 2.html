<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISCI Wiz</title>
<meta name="description" content="R&R Production's ISCI Wiz Kid — turns a deliverables matrix into ISCI codes and filenames.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --paper:#FFFAE5; --surface:#FFFDF5; --sunk:#F4EEDA; --ink:#1C1C1C; --muted:#615B52; --line:#DAD3C2; --line-strong:#1C1C1C;
  --blue:#1405FF; --on-blue:#FFFAE5; --blue-ink:#1405FF; --yellow:#C2FF00; --orange:#FF2300; --pink:#FF00B7; --teal:#00DEB5; --gray:#C4C0BC;
  --danger:#C41C00; --danger-bg:#FFE4DC; --ok:#00735D; --ok-bg:#D9F8EF; --warn-bg:#F3FFC9;
  --focus:0 0 0 3px rgba(20,5,255,.35);
  --display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1C1C1C; --surface:#252422; --sunk:#2E2C29; --ink:#FFFAE5; --muted:#B8B1A5; --line:#403D38; --line-strong:#FFFAE5;
    --blue-ink:#A29BFF; --danger:#FF7A5C; --danger-bg:#3A1E17; --ok:#00DEB5; --ok-bg:#12302A; --warn-bg:#2C3313;
    --focus:0 0 0 3px rgba(162,155,255,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1C1C1C; --surface:#252422; --sunk:#2E2C29; --ink:#FFFAE5; --muted:#B8B1A5; --line:#403D38; --line-strong:#FFFAE5;
  --blue-ink:#A29BFF; --danger:#FF7A5C; --danger-bg:#3A1E17; --ok:#00DEB5; --ok-bg:#12302A; --warn-bg:#2C3313;
  --focus:0 0 0 3px rgba(162,155,255,.5);
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus)}
a{color:var(--blue-ink)}

/* ---------- top band ---------- */
.band{background:var(--blue);color:var(--on-blue);padding-inline:16px}
.band-in{max-width:1240px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:18px 16px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mark h1{margin:0;font:400 44px/0.9 var(--display);letter-spacing:.01em;color:var(--yellow);text-transform:uppercase}
.mark .by{font:600 12px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.mark .by b{font-weight:700}
.mark .ver{font:600 12px/1 var(--mono);letter-spacing:.04em;background:var(--yellow);color:#1C1C1C;padding:5px 9px;border-radius:999px;align-self:center}
.band .tag-line{font:italic 400 18px/1.2 var(--serif);opacity:.95}

/* ---------- shell ---------- */
.wrap{padding-inline:16px;padding-block:24px 48px}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:16px}}

/* ---------- Wiz ---------- */
.wiz{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:14px}
.wiz-frame{border-radius:26px;overflow:hidden;border:3px solid var(--ink);background:var(--gray);aspect-ratio:1/1;max-width:100%;position:relative}
.wiz-frame img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .18s ease}
.wiz-name{position:absolute;left:12px;bottom:12px;background:var(--yellow);color:#1C1C1C;font:400 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px 6px;border-radius:999px;border:2px solid #1C1C1C}
.bubble{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:22px;padding:16px 18px;position:relative}
.bubble::before{content:"";position:absolute;top:-9px;left:34px;width:16px;height:16px;background:var(--surface);border-left:1.5px solid var(--line-strong);border-top:1.5px solid var(--line-strong);transform:rotate(45deg)}
.bubble p{margin:0;font:400 21px/1.28 var(--serif);text-wrap:pretty}
.bubble p + p{margin-top:8px}
.bubble em{font-style:italic}
.bubble code{font:600 14px/1 var(--mono);background:var(--sunk);padding:2px 5px;border-radius:6px;white-space:nowrap}
@media (max-width:900px){
  .wiz{position:static;grid-template-columns:96px minmax(0,1fr);align-items:start;gap:12px}
  .wiz-frame{border-radius:20px;border-width:2px}
  .wiz-name{display:none}
  .bubble::before{top:22px;left:-9px;transform:rotate(-45deg)}
  .bubble p{font-size:18px}
}

/* ---------- stepper ---------- */
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font:600 13px/1 var(--mono);color:var(--muted)}
.steps .done button{color:var(--ink);border-color:var(--line)}
.steps .done .n{background:var(--blue);color:var(--on-blue)}
.steps .cur button{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps .cur .n{background:var(--yellow);color:#1C1C1C}
.steps button:disabled{cursor:default;opacity:.55}

/* ---------- main frame ---------- */
.frame{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:24px;padding:28px}
@media (max-width:600px){.frame{padding:20px 16px;border-radius:20px}}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-ink);margin:0 0 8px}
h2.title{margin:0 0 6px;font:400 40px/1 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.lede{margin:0 0 24px;color:var(--muted);max-width:62ch}
h3{margin:0 0 10px;font:700 13px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.section{display:grid;gap:12px}
.stack{display:grid;gap:26px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
@media (max-width:680px){.grid2{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:6px;align-content:start}
.field > label, .lbl{font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.req{color:var(--danger);margin-left:4px}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:600}
.okmsg{font-size:13px;color:var(--ok);font-weight:600}
input[type=text],select{height:46px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 14px;width:100%;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--blue-ink);outline:none;box-shadow:var(--focus)}
input.mono{font:600 16px/1 var(--mono);letter-spacing:.02em}
input.bad{border-color:var(--danger)}
input.good{border-color:var(--ok)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.sm input[type=text],.sm select,input.sm,select.sm{height:38px;border-radius:10px;font-size:14px;padding:0 10px}
.sm select, select.sm{padding-right:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.zap{background:var(--yellow);border-color:#1C1C1C;color:#1C1C1C;border-width:2px;font-size:16px;height:52px;padding:0 26px}
.btn.zap:hover{filter:brightness(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.small{height:36px;padding:0 14px;font-size:14px}
.btn.link{border:none;height:auto;padding:0;color:var(--blue-ink);text-decoration:underline;text-underline-offset:3px;background:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--paper)}
.seg button{border:none;background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;padding-top:20px;border-top:1.5px dashed var(--line);flex-wrap:wrap}
.nav .why{color:var(--muted);font-size:14px}

/* client picker */
.picker{position:relative}
.opts{margin-top:6px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);max-height:236px;overflow:auto}
.opts button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border:none;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.opts button:last-child{border-bottom:none}
.opts button:hover,.opts button:focus-visible{background:var(--sunk);box-shadow:none}
.code{font:600 14px/1 var(--mono);letter-spacing:.04em;background:var(--yellow);color:#1C1C1C;padding:5px 7px;border-radius:7px}
.picked{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ok);background:var(--ok-bg);border-radius:14px;padding:10px 14px;flex-wrap:wrap}
.picked .nm{font-weight:600}
.newclient{border:1.5px dashed var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}

/* dropzone */
.drop{display:grid;place-items:center;text-align:center;gap:8px;border:2px dashed var(--line);border-radius:22px;padding:36px 20px;cursor:pointer;background:var(--paper);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue-ink);background:var(--sunk)}
.drop .big{font:400 26px/1 var(--display);text-transform:uppercase}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.filecard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--paper)}
.filecard .fn{font-weight:600;word-break:break-all}
.xl{font:400 13px/1 var(--display);background:#1C1C1C;color:var(--yellow);padding:8px 8px 7px;border-radius:8px;letter-spacing:.06em}

.tallies{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tally{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--paper)}
.tally .v{font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tally .k{font-size:13px;color:var(--muted);margin-top:4px}

.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
details.more{border:1.5px solid var(--line);border-radius:16px;background:var(--paper)}
details.more > summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"+";font:600 18px/1 var(--mono)}
details.more[open] > summary::after{content:"–"}
details.more .inner{padding:0 16px 16px;display:grid;gap:10px}

.tag{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;color:#1C1C1C;white-space:nowrap}
.tag.D{background:var(--teal)}
.tag.T{background:var(--orange)}
.tag.R{background:var(--pink)}
.tag.skip{background:var(--sunk);color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--ink)}

/* tables */
.tblwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font:700 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;z-index:1}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num{font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
td .raw{font-size:13px;color:var(--muted);max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
td input[type=text]{height:36px;border-radius:9px;font-size:14px;padding:0 10px;min-width:120px}
td select{height:36px;border-radius:9px;font-size:14px;padding:0 30px 0 10px;min-width:130px}
.isci{font:600 14px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.fname{font:500 13px/1.35 var(--mono);word-break:break-all;min-width:280px}
.fname .edited{margin-left:6px}
.scroll-tall{max-height:560px;overflow:auto}

.note{border-radius:16px;padding:14px 16px;background:var(--warn-bg);border:1.5px solid var(--line)}
.note.bad{background:var(--danger-bg);border-color:var(--danger)}
.note b{font-weight:700}
.example{font:600 14px/1.45 var(--mono);background:#1C1C1C;color:#FFFAE5;border-radius:14px;padding:14px 16px;word-break:break-all}
.example .i{color:var(--yellow)}

.logcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:start;border:1.5px solid var(--line);border-radius:18px;padding:18px;background:var(--paper)}
@media (max-width:600px){.logcard{grid-template-columns:minmax(0,1fr)}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.next-up{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.ranges{display:grid;gap:10px}
.drop.slim{display:flex;justify-content:flex-start;text-align:left;padding:16px 18px;gap:14px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px;background:var(--paper);font-size:13px;font-weight:600}
.chip .x{border:none;background:var(--sunk);border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:15px;line-height:1}
.logsrc{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1.5px solid var(--ok);background:var(--ok-bg);border-radius:14px;padding:10px 12px}
.logsrc .mono-sm{flex-basis:100%;font:500 12px/1.4 var(--mono);word-break:break-all}
.fams{display:grid;gap:6px}
tr.off td{color:var(--muted)}
tr.off td:not(:first-child){opacity:.6}
.switch{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;pointer-events:none;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--blue)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{box-shadow:var(--focus)}
.range{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--paper)}
.range .isci{font-size:16px}
.range .arrow{color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#1C1C1C;color:#FFFAE5;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.foot{max-width:1240px;margin:28px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.foot i{font-family:var(--serif);font-size:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="band">
  <div class="band-in">
    <div class="mark">
      <h1>ISCI Wiz</h1>
      <span class="by"><b>R&amp;R partners</b> · Production</span>
      <span class="ver" title="ISCI Wiz version">Beta v3.2</span>
    </div>
    <span class="tag-line">turning problems into playgrounds</span>
  </div>
</header>

<div class="wrap">
  <div class="shell">
    <aside class="wiz" aria-label="ISCI Wiz Kid">
      <div class="wiz-frame"><img id="wizImg" alt="ISCI Wiz Kid, a felt puppet in a code-covered wizard hat" src=""><span class="wiz-name">ISCI Wiz Kid</span></div>
      <div class="bubble" id="wizSay" role="status" aria-live="polite"></div>
    </aside>
    <main>
      <ol class="steps" id="steps"></ol>
      <section class="frame" id="stage"></section>
    </main>
  </div>
  <footer class="foot">
    <span>ISCI Wiz Beta v3.2 · ISCI format: client code + media type (T broadcast · D digital · R radio) + year + sequence. Broadcast ISCIs end in H.</span>
    <i>est. 1974 · rrpartners.com</i>
  </footer>
</div>
<div id="toastHost"></div>

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const xmlEsc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const str = v => v==null ? "" : String(v).replace(/\s+/g," ").trim();
const isBlank = v => v==null || String(v).trim()==="";
const pad2 = n => n < 100 ? String(n).padStart(2,"0") : String(n);
function colNum(L){ let n=0; for(const ch of L.toUpperCase()) n = n*26 + (ch.charCodeAt(0)-64); return n; }
function colLet(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }
function parseRef(ref){ const m=/^\$?([A-Z]+)\$?(\d+)$/i.exec(ref||""); return m ? {c:colNum(m[1]), r:+m[2]} : null; }
function parseRange(ref){ const [a,b]=String(ref||"").split(":"); const A=parseRef(a), B=parseRef(b||a); return A&&B ? {r1:Math.min(A.r,B.r), c1:Math.min(A.c,B.c), r2:Math.max(A.r,B.r), c2:Math.max(A.c,B.c)} : null; }
const store = {
  get(k, d){ try{ const v = localStorage.getItem("isciwiz:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("isciwiz:"+k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const host=$("#toastHost"); host.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>{host.innerHTML="";}, 2600); }

  xml = patchSheet(xml, edits, styler, widths);
  zip.file(sh.path, xml);
  if(styler.changed) zip.file(S.wb.stylesPath, styler.xml);
  return zip.generateAsync({type:"blob", compression:"DEFLATE", compressionOptions:{level:6}, mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function outName(){
  const base = S.file.name.replace(/\.xls[xm]$/i, "");
  return (S.jobCell ? "" : S.job + "_") + base + "_ISCI.xlsx";
}
async function saveFile(name, blob){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename:name, data:blob}); return "saved"; }
      return "blocked";
    }
  }catch(e){ return e && e.code === "declined" ? "declined" : "blocked"; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return "saved";
}

/* =========================================================
   Loading a matrix
   ========================================================= */
async function loadFile(name, buf){
  S.loadErr = null;
  if(!/\.xls[xm]$/i.test(name)){ S.loadErr = /\.(xls|csv|numbers|pdf)$/i.test(name) ? "format" : "format"; S.file = null; renderStep(); return; }
  try{
    const wb = await readWorkbook(buf);
    if(!wb.sheets.length) throw new Error("no-sheets");
    S.file = {name, buf}; S.wb = wb;
    S.sheetIdx = Math.max(0, wb.sheets.findIndex(s => s.state === "visible"));
    await loadSheet();
  }catch(e){ console.error(e); S.loadErr = "read"; S.file = null; S.wb = null; S.grid = null; renderStep(); }
}
async function loadSheet(){
  S.grid = await readSheet(S.wb, S.sheetIdx);
  S.hdr = detectHeader(S.grid);
  S.jobCell = findJobCell(S.grid, S.hdr ? S.hdr.row : 6);
  reextract();
}
function reextract(){
  S.skip = new Set(); S.groups = {};
  if(S.hdr && (S.hdr.cols.length || S.hdr.cols.aspect)){ S.rows = extractRows(S.grid, S.hdr); buildMaps(); }
  else { S.rows = []; S.groups = {}; S.gOrder = []; }
  S.reached = Math.min(S.reached, 1);
  renderStep();
}

/* =========================================================
   Validation
   ========================================================= */
const jobOk = () => /^\d{6}\.\d{2,3}$/.test(S.job.trim());
const clientOk = () => !!(S.client && /^[A-Z0-9]{3}$/.test(S.client.code));
const campOk = () => !S.campaign.trim() || S.includeCampaign !== null;
function stepBlocker(i){
  if(i === 0){
    if(!jobOk()) return "Add a valid job code.";
    if(!clientOk()) return "Pick a client code.";
    if(!campOk()) return "Say whether the campaign name goes in the filenames.";
    return "";
  }
  if(i === 1){
    if(!S.file) return "Upload the deliverables matrix.";
    if(!S.hdr) return "Wiz couldn't find the header row.";
    if(!S.hdr.cols.isci) return "Choose the ISCI column.";
    if(!S.rows.some(r => r.include)) return "No spots to tag yet.";
    if(!S.rows.some(active)) return "Pick at least one placement to tag now.";
    return "";
  }
  if(i === 2) return "";
  if(i === 3){ for(const t of mediaTypes()){ if(!lastState(t).ok) return `Add the last ${TYPE_NAME[t].toLowerCase()} ISCI from the log.`; } return ""; }
  return "";
}

function renderSteps(){
  $("#steps").innerHTML = STEPS.map((l, i) => {
    const cls = i === S.step ? "cur" : i < S.step || i <= S.reached ? "done" : "";
    const can = i <= S.reached && i !== S.step;
    return `<li class="${cls}"><button type="button" data-go="${i}" ${can || i===S.step ? "" : "disabled"} ${i===S.step?'aria-current="step"':""}><span class="n">${i < S.step || (i <= S.reached && i !== S.step) ? "✓" : i+1}</span>${l}</button></li>`;
  }).join("");
}
function navHtml(nextLabel, opts={}){
  const block = stepBlocker(S.step);
  return `<div class="nav">
    <div>${S.step > 0 ? `<button type="button" class="btn" data-act="back">Back</button>` : ""}</div>
    <div class="actions">${block ? `<span class="why" id="why">${esc(block)}</span>` : `<span class="why" id="why"></span>`}
    ${nextLabel ? `<button type="button" class="btn primary" data-act="next" id="nextBtn" ${block?"disabled":""}>${esc(nextLabel)}</button>` : ""}</div>
  </div>`;
}
function refreshNav(){
  const b = stepBlocker(S.step); const nb = $("#nextBtn"), why = $("#why");
  if(nb) nb.disabled = !!b; if(why) why.textContent = b;
}
function renderStep(){
  renderSteps();

}

        ${notes.map(r => `<tr><td class="num">${r.r}</td><td>${esc(r.placement||"—")}</td><td>${esc([r.title, r.langRaw].filter(Boolean).join(" · ")||"—")}</td><td><label class="chk"><input type="checkbox" data-inc="${r.r}" ${r.include?"checked":""}> Tag</label></td></tr>`).join("")}
        </tbody></table></div></div></details>` : ""}
      ${filled.length ? `<div class="note"><b>${filled.length} row${filled.length>1?"s":""} already have an ISCI.</b> Wiz leaves them alone.${elsewhere.length ? ` ${elsewhere.length} of them had the code outside the ISCI column (e.g. row ${elsewhere[0].r}, column ${colLet(elsewhere[0].where)}: <span class="isci">${esc(elsewhere[0].existing.slice(0,40))}</span>).` : ""}</div>` : ""}
    `;
    if(!h.cols.isci) wiz("confused", `<p>I found the spots but not an ISCI column. Pick one under “Columns Wiz matched”.</p>`);
    else if(!spots.length && S.rows.some(r => r.include)) wiz("thoughtful", `<p>Everything’s on hold right now. Tick at least one placement to tag.</p>`);
    else if(!spots.length && /template only/i.test(String(g.raw.get("1,1")||""))) wiz("confused", `<p>This looks like the <em>blank template</em>. Make a copy for the job, fill in Spot Length, Aspect Ratio and Version for each spot, then drop that copy in.</p>`);
    else if(!spots.length) wiz("sad", `<p>I can’t find any spots with a length or size on this tab. Is this the right tab?</p>`);
    else if(held.length) wiz("thoughtful", `<p>Got it: tagging <em>${spots.length} spots</em> now and holding ${held.map(k => esc(S.groups[k].platform)).join(", ")} for later.</p><p>Held rows stay blank, so I can tag them next time.</p>`);
    else wiz("happy", `<p>Found <em>${spots.length} spots</em> across ${S.gOrder.filter(k=>S.groups[k].n).length} placements${notes.length ? `. ${notes.length} row${notes.length>1?"s look":" looks"} like notes, so I left ${notes.length>1?"them":"it"} out` : ""}.</p>${byT.T ? `<p>${byT.T} are broadcast (Comcast or masters), so they get <code>T</code> ISCIs ending in H.</p>` : `<p>No Comcast broadcast or masters here, so everything gets digital <code>D</code> ISCIs.</p>`}`);
  }
  st.innerHTML = `<p class="eyebrow">Step 2 of 5</p><h2 class="title">Feed Wiz the matrix</h2>
    <p class="lede">Check what Wiz found. Anything off? Fix the column matches below.</p>
    <div class="stack">
      <div class="filecard"><span class="xl">XLSX</span><span class="fn">${esc(S.file.name)}</span>${sheetSel}<button type="button" class="btn small" data-act="replace">Use a different file</button></div>
      ${body}
    </div>
    ${navHtml("Next: tune-up")}`;
}
function wireDrop(){
  const d = $("#drop"); if(!d) return;
  ["dragenter","dragover"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) readFile(f); });
}
function readFile(f){ wiz("thoughtful", `<p>Reading <em>${esc(f.name)}</em>…</p>`); f.arrayBuffer().then(buf => loadFile(f.name, buf)); }

function exampleHtml(){

/* ---------- Step 4: ISCI log ---------- */
const LOG_NAME = {T:"Broadcast", D:"Social / Content", R:"Radio"};
function reuseBanner(){
  if(!S.logs.length) return "";
  const hits = S.reuse ? logHits() : (S.reuse = true, (() => { const h = logHits(); S.reuse = false; return h; })());
  if(!hits.size) return "";
  const ns = [...hits.values()].map(h => h.n).sort((a, b) => a - b);
  const byPl = {}; S.rows.forEach(r => { if(hits.has(r.r)){ const p = S.groups[r.gk].platform; byPl[p] = (byPl[p]||0) + 1; } });
  return `<div class="note"><b>${hits.size} spot${hits.size>1?"s are":" is"} already in the log</b> with the same title, length, size, language and platform (${Object.entries(byPl).map(([p, n]) => `${esc(p)} ${n}`).join(" · ")}).
    ${S.reuse ? `Wiz will write those codes back into the matrix and only make new codes for the rest.` : `Wiz is set to give them new codes anyway.`}
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="reuse" ${S.reuse?"checked":""}> Reuse the logged codes (recommended)</label></div>`;
}
function logSourceHtml(t){
  const L = S.last[t], code = S.client.code;
  if(!S.logs.length) return "";
  const cands = logCandidates(t);
  const parts = [];
  if(L.manual) parts.push(`<div class="hint">You typed this one in, so Wiz isn’t using the log for it. <button type="button" class="btn link" data-uselog="${t}">Use the log again</button></div>`);
  else if(L.src && L.src.last){
    const s = L.src.last;
    parts.push(`<div class="logsrc"><span class="okmsg">Found in the log:</span> <span class="code">${esc(s.raw)}</span>
      <span class="hint">${esc(s.tab)} tab, row ${s.row}${s.date ? " · " + esc(s.date) : ""}${s.job ? " · job " + esc(s.job) : ""}</span>
      <div class="hint mono-sm">${esc(s.title.slice(0, 90))}</div></div>`);
  } else if(L.src && L.src.placeholder) parts.push(`<div class="hint"><span class="okmsg">Found in the log:</span> only a pre-numbered blank row for ${code}, so Wiz starts at 01.</div>`);
  else if(L.src && L.src.notFound) parts.push(`<div class="note">No ${code} ${TYPE_NAME[t].toLowerCase()} codes for ${S.year} in ${esc(S.logs.filter(l => l.kind === t).map(l => l.name).join(", "))}. If this client is new to ${TYPE_NAME[t].toLowerCase()}, tick “start at 01”. If the log files it under a different code, type the last one in.</div>`);
  else if(!logLoadedFor(t)) parts.push(`<div class="hint">No ${LOG_NAME[t]} log loaded. Drop it above, or type the last code in.</div>`);
  if(cands.length > 1 || cands.some(c => c.rel !== "direct")){
    parts.push(`<div class="fams"><span class="lbl">Codes Wiz counted</span>${cands.map(c => `<label class="chk"><input type="checkbox" data-fam="${t}|${esc(c.f.k)}" ${c.on?"checked":""} ${L.manual?"disabled":""}>
      <span><b class="isci">${esc(c.name)}</b> · ${c.f.used.length} logged${c.last ? `, last ${esc(c.last.raw)}` : ""}${c.rel === "legacy" ? ' <span class="pill">old social format</span>' : c.rel === "other" ? ' <span class="pill warn">different code, same client tab</span>' : ""}</span></label>`).join("")}</div>`);
  }
  const on = cands.filter(c => c.on);
  const mism = on.flatMap(c => c.f.mism).slice(0, 2);
  mism.forEach(m => parts.push(`<div class="hint">Heads up: ${esc(m.tab)} row ${m.row} lists both ${esc(m.a)} and ${esc(m.b)}. Wiz went with ${esc(m.a)} from the spot title.</div>`));
  const lastN = L.src && L.src.last ? L.src.last.n : 0;
  const open = on.flatMap(c => c.f.open).filter(o => o.n > lastN).map(o => o.n).sort((a, b) => a - b);
  if(open.length && L.src && L.src.last) parts.push(`<div class="hint">${open.length} pre-numbered row${open.length>1?"s":""} with no spot title (${pad2(open[0])}${open.length>1?"–"+pad2(open[open.length-1]):""}) ${open.length>1?"are":"is"} still open, so Wiz starts there.</div>`);
  return parts.join("");
}

  $("#stage").innerHTML = `

          <input type="file" id="logfile" multiple accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </label>
        ${reuseBanner()}
        ${S.logs.length ? `<div class="chips">${S.logs.map(l => `<span class="chip"><span class="tag ${l.kind}">${LOG_NAME[l.kind]}</span>${esc(l.name)}<button type="button" class="x" data-droplog="${esc(l.name)}" aria-label="Remove ${esc(l.name)}">×</button></span>`).join("")}</div>` : ""}
      </div>

      <div class="logcard" data-log="${t}">

          ${t==="D" ? `<span class="hint">Old social codes like <code style="font-family:var(--mono)">SO${code}${yy()}17</code> work too. Wiz switches them to the new D format.</span>` : ""}

function logMsg(t){
  const st = lastState(t), L = S.last[t];
  if(st.needChoice){
    return `<div class="note"><b>That ISCI is from 20${st.p.yr}, but this job uses ${S.year} ISCIs.</b> How should the count go?
      <div class="seg" role="group" style="margin-top:10px"><button type="button" data-choice="${t}:continue" aria-pressed="${L.choice==="continue"}">Keep counting from ${pad2(st.p.seq+1)}</button><button type="button" data-choice="${t}:reset" aria-pressed="${L.choice==="reset"}">Start ${S.year} at 01</button></div></div>`;
  }
  if(st.dup) return `<div class="note bad"><b>${esc(st.msg)}</b>
    <div style="margin-top:10px"><button type="button" class="btn small" data-after="${t}">Start after ${esc(st.dup.raw)}</button></div></div>`;
  if(!st.ok) return st.msg ? `<span class="err">${esc(st.msg)}</span>` : "";
  const hits = logHits(); const n = S.rows.filter(r => active(r) && !hits.has(r.r) && S.groups[r.gk].media === t).length;
  const extra = st.p && st.p.yr !== yy() ? `<div class="seg" role="group" style="margin-top:8px"><button type="button" data-choice="${t}:continue" aria-pressed="${L.choice==="continue"}">Keep counting</button><button type="button" data-choice="${t}:reset" aria-pressed="${L.choice==="reset"}">Start at 01</button></div>` : "";
  return `<div class="next-up"><span class="okmsg">Next up:</span><span class="code">${makeISCI(t, st.start)}</span><span class="hint">through</span><span class="code">${makeISCI(t, st.start + n - 1)}</span>${st.p && st.p.legacy ? '<span class="pill warn">converted from SO format</span>' : ""}</div>${extra}`;
}
function wizLog(){
  const types = mediaTypes();
  const need = types.find(t => lastState(t).needChoice);
  if(need){ const p = lastState(need).p; return wiz("surprised", `<p>Whoa, that’s a 20${p.yr} code, but we’re making ${S.year} ISCIs. Should I keep counting, or start ${S.year} at 01?</p>`); }
  const dup = types.find(t => lastState(t).dup);
  const hitsN = logHits().size;
  if(dup){ const d = lastState(dup).dup; return wiz("surprised", `<p>Hold on! This matrix already uses <code>${esc(d.raw)}</code>, but the log stops earlier. If the first batch never got logged, I’d hand out repeat codes.</p><p>Start after <code>${esc(d.raw)}</code>, and log both batches.</p>`); }
  const bad = types.find(t => { const s = lastState(t); return !s.ok && s.msg; });
  if(bad) return wiz("confused", `<p>${esc(lastState(bad).msg)}</p>`);
  const fromLog = types.filter(t => S.last[t].src && S.last[t].src.last && !S.last[t].manual);
  if(!stepBlocker(3) && fromLog.length) return wiz("happy", `<p>Found it in the log! ${fromLog.map(t => `Last ${TYPE_NAME[t].toLowerCase()}: <code>${esc(S.last[t].src.last.raw)}</code>`).join(". ")}.</p><p>I’ll start right after. Give it a quick look, then generate.</p>`);
  if(!stepBlocker(3)) return wiz("proud", `<p>Got it. I’ll pick up right after the log. Ready when you are.</p>`);
  if(hitsN && !types.length) return wiz("proud", `<p>Every spot in this matrix is already in the log, so there’s nothing new to number. I’ll write the logged codes back into the matrix.</p>`);
  if(!S.logs.length) return wiz("thoughtful", `<p>Drop in the <em>ISCI logs</em> and I’ll find the last ${S.client.code} code myself. Or type it in if you already know it.</p>`);
  wiz("thoughtful", `${hitsN ? `<p>Good news: ${hitsN} of these spots are already in the log, so I’ll reuse their codes.</p>` : ""}<p>What’s the <em>last ISCI</em> in the log for ${S.client.code}${hitsN ? " for the rest" : ""}? I’ll start with the next number.</p>`);
}

    </div>
    ${navHtml("")}`;
  wiz("proud", `<p><em>${res.length} ISCIs, zero typos.</em></p>${ranges.length ? `<p>Download the matrix, then log ${ranges.map(r => `<code>${r.first.isci}</code> through <code>${r.last.isci}</code>`).join(" and ")}.</p>` : ""}${reused.length ? `<p>${reused.length} came straight from the log, so they don’t need logging again.</p>` : ""}`);
}
function heldHtml(){
  const held = S.gOrder.filter(k => S.groups[k].n && !S.groups[k].on);
  const sk = [...S.skip].sort((a, b) => a - b);
  if(!held.length && !sk.length) return "";
  return `<div class="note"><b>Held for later:</b> ${[
    ...held.map(k => `${esc(S.groups[k].platform)} (${S.groups[k].n} spot${S.groups[k].n>1?"s":""})`),
    ...(sk.length ? [`row${sk.length>1?"s":""} ${sk.join(", ")}`] : [])].join(" · ")}. These stay blank in the matrix.
    ${sk.length ? ` <button type="button" class="btn link" data-unskip="all">Bring back skipped rows</button>` : ""}</div>`;
}
function rowsHtml(res){
  const q = S.q.trim().toLowerCase();
  const xs = res.filter(x => (S.filter === "all" || (S.filter === "log" ? x.reused : (x.t === S.filter && !x.reused))) && (!q || x.fn.toLowerCase().includes(q) || x.isci.toLowerCase().includes(q)));
  if(!xs.length) return `<tr><td colspan="5" class="hint">No rows match.</td></tr>`;
  return xs.map(x => {
    const isEd = S.editing === x.row.r;
    const pre = x.isci.replace("-","") + "_";
    return `<tr><td class="num">${x.row.r}</td><td><span class="raw" title="${esc(x.row.placement)}">${esc(S.groups[x.row.gk].platform)}</span></td>
      <td><span class="isci">${x.isci}</span>${x.reused ? ' <span class="pill">from log</span>' : ""}</td>
      <td class="fname">${isEd ? `<div style="display:flex;gap:6px;align-items:center"><span>${esc(pre)}</span><input type="text" id="edTail" value="${esc(x.fn.slice(pre.length))}" aria-label="Filename after the ISCI" style="flex:1;min-width:200px"></div>` : `${esc(x.fn)}${x.edited?'<span class="pill warn edited">edited</span>':""}`}</td>
      <td style="white-space:nowrap">${isEd ? `<button type="button" class="btn small primary" data-save="${x.row.r}">Save</button>` : `<button type="button" class="btn small" data-edit="${x.row.r}">Edit</button> <button type="button" class="btn small" data-skip="${x.row.r}" aria-label="Skip row ${x.row.r}">Skip</button>${x.edited?` <button type="button" class="btn link" data-reset="${x.row.r}">Reset</button>`:""}`}</td></tr>`;
  }).join("");
}
function refreshRows(){ const b = $("#rowsBody"); if(b) b.innerHTML = rowsHtml(compute()); }

/* =========================================================
   Events
   ========================================================= */
function go(i){ S.step = i; S.reached = Math.max(S.reached, i); S.editing = null; renderStep(); window.scrollTo({top:0, behavior:"smooth"}); }
document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-client]"); if(!t) return;
  const d = t.dataset;
  if(d.go != null){ if(+d.go !== S.step) go(+d.go); return; }
  if(d.client){ S.client = {name:d.name, code:d.client, isNew:false, source:"list"}; S.clientQ = ""; renderJob(); refreshNav(); return; }
  if(d.camp != null){ S.includeCampaign = d.camp === "1"; $("#campQ").innerHTML = campQ(); refreshNav(); wizJob(); return; }
  if(d.ncHas){ S.nc.has = d.ncHas; if(d.ncHas === "no" && !S.nc.code) S.nc.code = suggestCode(S.nc.name, takenCodes()); syncNewClient(); renderJob(); return; }
  if(d.gmedia != null) return;
  if(d.filter){ S.filter = d.filter; $$("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === S.filter))); refreshRows(); return; }
  if(d.edit){ S.editing = +d.edit; refreshRows(); const i = $("#edTail"); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if(d.save){ saveEdit(); return; }
  if(d.reset){ delete S.tails[+d.reset]; refreshRows(); return; }
  if(d.skip){ S.skip.add(+d.skip); if(!S.rows.some(active)){ S.skip.delete(+d.skip); toast("That’s the last spot. Keep at least one."); return; } renderDeliver(); toast(`Row ${d.skip} held for later`); return; }
  if(d.unskip){ S.skip = new Set(); renderDeliver(); return; }
  if(d.allg != null){ S.gOrder.forEach(k => { if(S.groups[k].n) S.groups[k].on = d.allg === "1"; }); renderMatrix(); refreshNav(); return; }
  if(d.after){ const L = S.last[d.after], ex = existingMax(d.after); L.text = makeISCI(d.after, ex.n); L.none = false; L.choice = null; L.manual = true; renderLog(); return; }
  if(d.uselog){ S.last[d.uselog].manual = false; renderLog(); return; }
  if(d.droplog){ S.logs = S.logs.filter(l => l.name !== d.droplog); for(const k of ["T","D","R"]){ S.last[k].manual = false; S.last[k].src = null; } renderLog(); return; }
  if(d.logcopy){ await copyLogRows(d.logcopy); return; }
  if(d.choice){ const [ty, ch] = d.choice.split(":"); S.last[ty].choice = ch; $("#logmsg-"+ty).innerHTML = logMsg(ty); refreshNav(); wizLog(); return; }
  switch(d.act){
    case "next": if(!stepBlocker(S.step)){ if(S.step === 0) rememberClient(); go(S.step + 1); } break;
    case "back": go(S.step - 1); break;
    case "clearClient": S.client = null; S.nc = {on:false, name:"", has:null, code:"", remember:true}; renderJob(); setTimeout(()=>{ const q=$("#clientQ"); if(q) q.focus(); }); break;
    case "ncStart": S.nc = {on:true, name:S.clientQ, has:null, code:"", remember:true}; S.client = null; renderJob(); setTimeout(()=>{ const n=$("#ncName"); if(n) n.focus(); }); break;
    case "ncCancel": S.nc.on = false; S.client = null; renderJob(); break;
    case "sample": { wiz("thoughtful", `<p>Whipping up a sample…</p>`); const buf = await sampleWorkbook(); S.sample = true; await loadFile("Sample - Deliverables Matrix.xlsx", buf); break; }
    case "replace": S.file = null; S.wb = null; S.grid = null; S.hdr = null; S.rows = []; S.reached = 1; renderStep(); break;
    case "download": await doDownload(t); break;
    case "copy": await doCopy(); break;
  }
});
function rememberClient(){
  if(!S.client || !S.client.isNew || !S.nc.remember) return;
  const list = customClients().filter(c => c[1] !== S.client.code); list.push([S.client.name, S.client.code]); store.set("clients", list);
}
function saveEdit(){
  const i = $("#edTail"); if(!i || S.editing == null) return;
  const r = S.editing; const row = S.rows.find(x => x.r === r);
  const v = i.value.split("_").map(seg).filter(Boolean).join("_");
  if(v && v !== tailFor(row)) S.tails[r] = v; else delete S.tails[r];
  S.editing = null; refreshRows();
}
async function doDownload(btn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Building…";
  try{
    const blob = await buildOutput();
    const r = await saveFile(outName(), blob);
    if(r === "saved"){ toast("Matrix downloaded"); wiz("proud", `<p>Done and dusted. Don’t forget to add the new codes to the <em>ISCI log</em>.</p>`); }
    else if(r === "declined") toast("Download cancelled");
    else { toast("Downloads are blocked here. Use the offline ISCI Wiz file instead."); wiz("sad", `<p>This view won’t let me hand you a file. Open the offline <em>ISCI Wiz</em> file and run it there.</p>`); }
  }catch(err){ console.error(err); wiz("sad", `<p>Something went wrong while I was writing the file. Try again, and if it keeps happening, send the matrix to whoever looks after ISCI Wiz.</p>`); toast("Couldn’t build the file"); }
  btn.disabled = false; btn.textContent = old;
}
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); toast(ok ? okMsg : "Copy is blocked here. Download the matrix instead.");
  }
}
async function copyLogRows(t){
  const d = new Date(), date = `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  const xs = compute().filter(x => x.t === t && x.isci && !x.reused);
  // The log tabs use spacer columns: A Date · C Job Number · E Spot Title · G ISCI Number
  const text = xs.map(x => [date, "", S.job, "", x.fn, "", x.isci].join("\t")).join("\n");
  await copyText(text, `Copied ${xs.length} rows for the ${LOG_NAME[t]} log`);
}
async function doCopy(){
  const res = compute();
  const lines = [["Row","ISCI","Filename","Type","Placement","Spot Title","Length","Size","Language","Platform"].join("\t")].concat(res.map(x => {
    const r = x.row, g = S.groups[r.gk];
    return [r.r, x.isci, x.fn, TYPE_NAME[x.t], r.placement, S.titleMap[r.tk].label, S.lenMap[r.lenK].label, S.sizeMap[r.szK].label, S.langMap[r.lk], g.platform].join("\t");
  }));
  const text = lines.join("\n");
  try{ await navigator.clipboard.writeText(text); toast(`Copied ${res.length} rows. Paste into Excel or the log.`); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove(); toast(ok ? `Copied ${res.length} rows` : "Copy is blocked here. Download the matrix instead.");
  }
}
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if(t.id === "job"){ S.job = t.value.trim(); t.classList.toggle("good", jobOk()); t.classList.toggle("bad", !!S.job && !jobOk()); $("#jobMsg").innerHTML = jobMsg(); refreshNav(); wizJob(); return; }
  if(t.id === "clientQ"){ S.clientQ = t.value; $("#clientOpts").innerHTML = clientOptions(); return; }
  if(t.id === "camp"){ const had = !!S.campaign.trim(); S.campaign = t.value; if(!!S.campaign.trim() !== had){ if(!S.campaign.trim()) S.includeCampaign = null; $("#campQ").innerHTML = campQ(); } else if(S.includeCampaign) $("#campQ").innerHTML = campQ(); refreshNav(); return; }
  if(t.id === "ncName"){ S.nc.name = t.value; syncNewClient(); if(!!t.value.trim() !== !!$("[data-nc-has]")){ renderJob(); const n=$("#ncName"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); } else { refreshNav(); } return; }
  if(t.id === "ncCode"){ t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g,""); S.nc.code = t.value; syncNewClient(); $("#ncMsg").innerHTML = ncMsg(); refreshNav(); return; }
  if(d.gplat != null){ S.groups[d.gplat].platform = t.value; S.tails = {}; $("#exFn").innerHTML = exampleHtml(); return; }
  if(d.title != null){ S.titleMap[d.title].label = t.value; S.tails = {}; $("#exFn").innerHTML = exampleHtml(); return; }
  if(d.lang != null){ S.langMap[d.lang] = t.value.toUpperCase(); S.tails = {}; $("#exFn").innerHTML = exampleHtml(); return; }
  if(d.len != null){ S.lenMap[d.len].label = t.value; S.tails = {}; $("#exFn").innerHTML = exampleHtml(); return; }
  if(d.size != null){ S.sizeMap[d.size].label = t.value; S.tails = {}; $("#exFn").innerHTML = exampleHtml(); return; }
  if(d.last){ S.last[d.last].text = t.value; S.last[d.last].choice = null; S.last[d.last].manual = true; S.last[d.last].src = null; $("#logmsg-"+d.last).innerHTML = logMsg(d.last); refreshNav(); wizLog(); return; }
  if(t.id === "q"){ S.q = t.value; refreshRows(); return; }
});
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if(t.id === "year"){ S.year = +t.value; renderJob(); return; }
  if(t.id === "file"){ const f = t.files && t.files[0]; if(f) readFile(f); return; }
  if(t.id === "sheet"){ S.sheetIdx = +t.value; await loadSheet(); return; }
  if(t.id === "ncRemember"){ S.nc.remember = t.checked; return; }
  if(d.map){ const v = t.value === "new" ? "new" : (t.value ? +t.value : null); S.hdr.cols[d.map] = v; if(d.map === "isci" && v === "new") S.hdr.cols.filename = "new"; reextract(); return; }
  if(t.id === "reuse"){ S.reuse = t.checked; applyLogsAll(); renderLog(); return; }
  if(d.gon != null){ S.groups[d.gon].on = t.checked; renderMatrix(); refreshNav(); return; }
  if(d.inc){ const r = S.rows.find(x => x.r === +d.inc); r.include = t.checked; buildMaps(); renderMatrix(); refreshNav(); return; }
  if(d.gmedia != null){ S.groups[d.gmedia].media = t.value; $("#exFn").innerHTML = exampleHtml(); return; }
  if(t.id === "logfile"){ const fs = [...(t.files||[])]; if(fs.length) loadLogs(fs); return; }
  if(d.fam){ const [ty, k] = d.fam.split("|"); S.last[ty].pick[k] = t.checked; applyLog(ty); renderLog(); return; }
  if(d.none){ S.last[d.none].none = t.checked; S.last[d.none].manual = true; S.last[d.none].src = null; const i = $("#last-"+d.none); i.disabled = t.checked; $("#logmsg-"+d.none).innerHTML = logMsg(d.none); refreshNav(); wizLog(); return; }
  if(d.lang != null || d.len != null || d.size != null || d.title != null || d.gplat != null){ t.value = t.value.trim(); }
});
document.addEventListener("keydown", e => {
  if(e.target.id === "edTail"){ if(e.key === "Enter"){ e.preventDefault(); saveEdit(); } if(e.key === "Escape"){ S.editing = null; refreshRows(); } }
  if(e.target.id === "clientQ" && e.key === "Enter"){ const b = $("#clientOpts [data-client]"); if(b){ e.preventDefault(); b.click(); } }
});

/* boot */
renderStep();
window.__ISCIWIZ__ = {S, logCandidates, applyLog, existingMax, compute, buildOutput, loadFile, langCode, normLen, normSize, suggestPlatform, suggestMedia, suggestCode, parseLast, lastState};
})();
</script>
