# Nginx Configuration for ISCI Management System
#
# Mirrors the live site config on the server: /etc/nginx/sites-available/isci-mgmt
# (symlinked into /etc/nginx/sites-enabled/). The "managed by Certbot" lines were
# written by `certbot --nginx`; keep them when copying this file to the server.
#
# Apply a change on the server:
#   sudo cp /etc/nginx/sites-available/isci-mgmt ~/isci-mgmt.nginx.bak
#   sudo cp nginx.conf /etc/nginx/sites-available/isci-mgmt
#   sudo nginx -t && sudo systemctl reload nginx
#
# New hostname: replace 54-158-87-192.sslip.io everywhere, then rerun
#   sudo certbot --nginx -d <hostname>

# Upstream configuration - points to PM2 app
upstream isci_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTPS server
server {
    server_name 54-158-87-192.sslip.io;

    # Access logs
    access_log /var/log/nginx/isci-mgmt-access.log;
    error_log /var/log/nginx/isci-mgmt-error.log;

    # Max upload size (for profile images)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Scanner noise: bots probe for dotfiles (/.env, /.git), PHP and WordPress paths.
    # Answer them here so they never reach Node or fill the PM2 error log.
    # /.well-known stays open for certbot.
    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* \.(php|asp|aspx|jsp|cgi|bak|sql)$ {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|cgi-bin)(/|$) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Static files
    location /assets/ {
        alias /var/www/isci-mgmt-system/build/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded profile images
    location /uploads/ {
        alias /var/www/isci-mgmt-system/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location = /favicon.ico {
        root /var/www/isci-mgmt-system/public;
        access_log off;
        log_not_found off;
    }

    # All other requests - proxy to Node.js app
    location / {
        proxy_pass http://isci_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/54-158-87-192.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/54-158-87-192.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP server: redirects the hostname to HTTPS; the bare IP gets a 404
server {
    if ($host = 54-158-87-192.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 54-158-87-192.sslip.io;
    return 404; # managed by Certbot
}
