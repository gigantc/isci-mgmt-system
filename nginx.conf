# Nginx Configuration for ISCI Management System
#
# This file should be copied to: /etc/nginx/sites-available/isci-mgmt
# Then symlinked to: /etc/nginx/sites-enabled/isci-mgmt
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/isci-mgmt
#   sudo ln -s /etc/nginx/sites-available/isci-mgmt /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

# Upstream configuration - points to PM2 app
upstream isci_app {
    # PM2 runs on localhost:3000
    server 127.0.0.1:3000;

    # Keep alive connections for better performance
    keepalive 64;
}

# HTTP Server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;

    # Replace with your domain name
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Replace with your domain name
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificate paths (Let's Encrypt will populate these)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (optional, uncomment after testing)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/isci-mgmt-access.log;
    error_log /var/log/nginx/isci-mgmt-error.log;

    # Max upload size (for profile images)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static files - served directly by Nginx
    location /assets/ {
        alias /var/www/isci-mgmt-system/build/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded profile images
    location /uploads/ {
        alias /var/www/isci-mgmt-system/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location = /favicon.ico {
        root /var/www/isci-mgmt-system/public;
        access_log off;
        log_not_found off;
    }

    # All other requests - proxy to Node.js app
    location / {
        proxy_pass http://isci_app;
        proxy_http_version 1.1;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Disable cache for dynamic content
        proxy_cache_bypass $http_upgrade;
    }
}

# Optional: HTTP to HTTPS redirect for bare IP address
# Uncomment if you want http://YOUR_IP to redirect to your domain
#
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     return 301 https://yourdomain.com$request_uri;
# }
